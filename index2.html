<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virginia Velix - Works</title>
  <style>
   /* Reset básico */
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
   }

   body {
    font-family:
     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
     sans-serif;
    background-color: #f2f2f2;
    color: #222;
    padding: 2rem 1rem;
   }

   .container {
    max-width: 1200px;
    margin: 0 auto;
   }

   /* Grilla principal */
   .works-grid {
    display: grid;
    grid-template-columns: 1fr; /* En celular ocupa 1 sola columna */
    gap: 1.5rem;
   }

   /* Pantallas medianas y grandes (Desktop/Tablet) */
   @media (min-width: 768px) {
    .works-grid {
     grid-template-columns: repeat(
      3,
      1fr
     ); /* Divide el contenedor en 3 partes iguales */
    }

    .card-tigre {
     grid-column: span 2; /* Ocupa 2 tercios (2 de las 3 columnas) */
    }

    .card-shop {
     grid-column: span 1; /* Ocupa 1 tercio restante */
    }
   }

   /* Estilos de las Cards */
   .card {
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    transition:
     transform 0.3s ease,
     box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
   }

   .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
   }

   /* Card del Tigre */
   .card-tigre .card-image {
    width: 100%;
    height: 380px;
    overflow: hidden;
   }

   .card-tigre .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
   }

   .card-content {
    padding: 1.5rem;
   }

   .card-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
   }

   .card-subtitle {
    font-size: 0.9rem;
    color: #666;
   }

   /* Card Visita la Tienda */
   .card-shop {
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2.5rem 2rem;
    background: #111111; /* Fondo oscuro elegante */
    color: #ffffff;
   }

   .card-shop .card-subtitle {
    color: #aaa;
    margin-top: 0.5rem;
    margin-bottom: 1.5rem;
    line-height: 1.4;
   }

   .btn-shop {
    display: inline-block;
    padding: 0.8rem 1.6rem;
    background-color: #ffffff;
    color: #111111;
    font-weight: 600;
    text-decoration: none;
    border-radius: 30px;
    transition:
     background-color 0.2s ease,
     transform 0.2s ease;
   }

   .btn-shop:hover {
    background-color: #e2e2e2;
    transform: scale(1.03);
   }
  </style>
 </head>
 <body>
  <div class="container">
   <div class="works-grid">
    <!-- Card del Tigre (2/3 del ancho en desktop) -->
    <article class="card card-tigre">
     <div class="card-image">
      <img
       src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=1200&q=80"
       alt="Ilustración Tigre"
      />
     </div>
     <div class="card-content">
      <h3 class="card-title">Tigre — Ilustración</h3>
      <p class="card-subtitle">Serie de ilustraciones botánicas y animales</p>
     </div>
    </article>

    <!-- Card Visita la Tienda (1/3 del ancho en desktop) -->
    <article class="card card-shop">
     <div class="card-content">
      <h3 class="card-title">Visita la tienda</h3>
      <p class="card-subtitle">
       Encuentra láminas, prints exclusivos y más obras de Virginia Velix.
      </p>
      <a
       href="https://tu-tienda.com"
       target="_blank"
       rel="noopener"
       class="btn-shop"
      >
       Ir a la tienda &rarr;
      </a>
     </div>
    </article>
   </div>
  </div>
 </body>
</html>
